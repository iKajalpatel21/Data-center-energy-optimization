# Data Center Energy Optimization - Production-Grade System
# Multi-phase development roadmap for ML-driven cooling and workload optimization

[metadata]
project_name = "Data Center Energy Optimization"
description = "Production-grade ML system for predicting PUE, forecasting workload spikes, and optimizing carbon-aware workload scheduling"
version = 0.1.0
author = "Kajal Patel"
license = "MIT"

[phase1]
name = "Data Foundation (Data Engineering)"
status = "in-progress"
components = [
    "Synthetic Data Generation",
    "NOAA Weather Integration", 
    "Kafka/Kinesis Ingestion Layer",
    "Data Validation & Schema Registry"
]

[phase2]
name = "Modeling & Spark MLlib"
status = "pending"
components = [
    "Random Forest - PUE Prediction",
    "LSTM - Workload Forecasting",
    "Feature Engineering Pipeline",
    "Model Training & Evaluation"
]

[phase3]
name = "Sustainability Logic"
status = "pending"
components = [
    "Carbon-Aware Scheduler",
    "Cooling Optimization Engine",
    "Renewable Energy Awareness",
    "Multi-zone Workload Distribution"
]

[phase4]
name = "Scaling & Deployment"
status = "pending"
components = [
    "Docker Containerization",
    "Prometheus + Grafana Monitoring",
    "GitHub Actions CI/CD",
    "AWS Infrastructure as Code"
]

[technologies]
streaming = "Apache Kafka"
processing = "Apache Spark"
ml_framework = "Spark MLlib, TensorFlow/Keras"
monitoring = "Prometheus, Grafana"
containerization = "Docker, Docker Compose"
orchestration = "Kubernetes (optional)"
cloud = "AWS (EC2, S3, Kinesis)"
languages = "Python, Scala"
database = "PostgreSQL, InfluxDB"

[data_sources]
servers = "Synthetic Generation (Phase 1) -> Production Agents (Phase 4)"
cooling = "BMC IPMI, Geist/Liebert APIs"
weather = "NOAA API (Free & Open)"
workload = "Kubernetes API, Mesos, or Custom Schedulers"
