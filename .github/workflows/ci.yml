name: CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: pip install black flake8

      - name: Check formatting (black)
        run: black --check src/ tests/

      - name: Lint (flake8)
        run: flake8 src/ tests/ --max-line-length=100 --extend-ignore=E203,W503

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          # Install core deps without heavy ML libs for faster CI
          pip install numpy pandas scikit-learn joblib scipy jsonschema
          pip install fastapi uvicorn pydantic httpx
          pip install pytest pytest-cov

      - name: Run unit tests (no ML model tests)
        run: |
          pytest tests/test_carbon_scheduler.py tests/test_cooling_optimizer.py tests/test_api.py \
            -v --tb=short \
            --cov=src --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build API image
        run: |
          docker build -f docker/Dockerfile.api -t dc-optimization-api:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d --name api-test -p 8000:8000 dc-optimization-api:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8000/health
          docker stop api-test
